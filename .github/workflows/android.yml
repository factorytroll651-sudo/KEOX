name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: |
          Z=$(ls *.zip | sort -V | tail -1)
          echo "Using $Z"
          mkdir -p project
          unzip -o "$Z" -d project
          find project -type f | sort
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --console=plain
        working-directory: project
      - uses: actions/upload-artifact@v4
        with:
          name: Keox-Ff-apk
          path: 'project/app/build/outputs/apk/debug/*.apk'
